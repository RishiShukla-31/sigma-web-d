<!-- Quick Quiz:
without using br tag, write a vertically aligned form asking for name, city and pincode-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>

    <h1>Form for Name, City and Pincode</h1>
    <form action="post">
        <div>
            <label for="Name">Enter your name</label>
            <input type="text" id="Name" placeholder="Enter your name here">
        </div>

        <div>
            <label for="City">Enter your city</label>
            <input type="text" id="city" placeholder="Enter your city here">
        </div>

        <div>
            <label for="Pincode">Enter your pincode</label>
            <input type="text" id="Pincode" placeholder="Pincode">
        </div>
    </form>
    
</body>
</html>
