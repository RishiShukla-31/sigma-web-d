<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar using flexbox</title>
    <style>
      /* .logo {
        width: 40px;
            height: 40px;
            background-color: blue;
      } */

      .logo img {
        width: 140px;
        height: auto;
      }

      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
      }

      .right ul {
        display: flex;
        align-items: center;
        gap: 20px;
    }
    .right ul li {
        display: flex;
        list-style: none;
      }

      header {
        border: 1px solid rgb(224, 210, 210);
        background-color: whitesmoke;
        width: 90vw;
        padding: 6px;
        justify-self: center;
        border-radius: 5px;
      }

      /* .right img{
            width: 19px;
            height: auto;
        } */

      .actions {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-left: auto;
        gap: 40px;
      }

      .right ul li span {
        font-size: 14px;
        margin: 5px;
        font-weight: 500;
      }

      .download {
        background-color: #ffd741;
        border: none;
        border-radius: 6px;
        font: 19px;
        padding: 15px 30px;
        cursor: pointer;
      }

      body {
        padding-top: 10px;
      }

      /* .language{
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            font-weight: 19px;
        } */

      .language {
        display: flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
        font-size: 16px;
      }

      .language img {
        object-fit: contain;
        width: 19px;
        height: auto;
      }

      /* .search img{
            object-fit: contain;
            width: 19px;
            height: auto;
        } */

      .search img {
        width: 22px;
        height: 22px;
        object-fit: contain;
      }

      .right {
        position: absolute;
        left: 45%;
        transform: translateX(-50%);
      }

    </style>
  </head>
  <body>
    <header>
      <nav>
        <div class="logo">
          <img
            src="https://www.ultraedit.com/wp-content/uploads/2023/01/UE-logo.svg"
            alt=""
          />
        </div>

        <div class="right">
          <ul>
            <li><span>Products</span>⌄</li>
            <li><span>Buy</span>⌄</li>
            <li><span>Renew</span>⌄</li>
            <li><span>Support</span>⌄</li>
            <li><span>Learn</span>⌄</li>
            <li><span>Company</span>⌄</li>
          </ul>
        </div>

        <div class="actions">
          <button class="download">Download</button>

          <div class="language">
            <img
              src="https://static.thenounproject.com/png/world-icon-81417-512.png"
              alt=""
            />English
          </div>

          <div class="search">
            <img
              src="https://cdn-icons-png.flaticon.com/512/9479/9479251.png"
              alt=""
            />
          </div>
        </div>
      </nav>
    </header>
  </body>
</html>
