<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ways to Attach CSS in HTML </title>
    <!-- this is External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- This is Internal CSS -->
    <style>
        h1{
            color: burlywood; 
            background-color: rgb(76, 51, 51);
        }
    </style>
</head>
<body> 
    <div>
        <ol>
            <li>Inline CSS</li>
            <li>Internal CSS</li> 
            <li>External CSS</li> 
        </ol>
    </div>

    <div>
        <!-- This is Inline CSS-->
    <h1 style="color: lightcoral; background-color: rgb(51, 38, 38);">hey this is Inline CSS</h1>
    </div>

    <div>
        <h1>This is Internal CSS</h1>
    </div>

    <div>
        <h2>This is External CSS</h2>
    </div>

</body>
</html>
