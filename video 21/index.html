<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: darkgrey;
        }
        /* The specificity of this selector is 1  */
        h1{
            color: aqua;
        } 
        
        /* The specificity of this is selector 10  */
        .yellow{
            color: yellowgreen;
        }


        /* The specificity of this is selector 10  */
        .cred{
            color: darkred;
        }
        
        /* The specificity of this is selector 1 + 10 = 11  */
        h1.cpurple{
            color: purple;
        }
        /* This is an example of attribute selector. The specificity of this is selector 10 */

        [data-x=a]{
            color: maroon;
        }
    </style>
</head>
<body>
    <div>
        <!-- <h1 style="color: darkkhaki;" class="yellow cred cpurple">CSS Specificity</h1> -->
        <!-- <h1 class="yellow cred cpurple" ÷data-x="a">CSS Specificity</h1> -->
        <h1 class="yellow cred cpurple" data-x="a">CSS Specificity</h1>
    </div>
    
</body>
</html>
