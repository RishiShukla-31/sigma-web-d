        /* Pseudo */
        .boxes::before{

        .boxes::after{
            content: "Learning more about CSS Selector / After Boxes";
            color: yellowgreen;

        ::selection{

        }

        .box::first-letter{

<body>
    <div class="boxes">
        <div data-color="primary" class="box">Hey I am box</div>
