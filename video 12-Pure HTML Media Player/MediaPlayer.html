<!-- you are given 12 files; 6 audio and 6 video Design a website using HTML only which shows these 12 files.
1.mp3, 2.mp3 ..... 6.mp4
1.mp4, 2.mp4 ..... 6.mp4 -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>HTML Media Player</h1>
    </header>

    <main>
        <h2>All Video</h2>
    </main>

    <span>
        <video src="1.mp4" controls></video>
    </span>

    <span>
        <video src="2.mp4" controls></video>
    </span>

    <span>
        <video src="3.mp4" controls></video>
    </span>

    <span>
        <video src="4.mp4" controls></video>
    </span>

    <span>
        <video src="5.mp4" controls></video>
    </span>

    <span>
        <video src="6.mp4" controls></video>
    </span>

    <main>
        <h2>All Audio</h2>
    </main>

    <span>
        <audio src="1.mp3" controls></audio>
    </span>
    <span>
        <audio src="2.mp3" controls></audio>
    </span>
    <span>
        <audio src="3.mp3" controls></audio>
    </span>
    <span>
        <audio src="4.mp3" controls></audio>
    </span>
    <span>
        <audio src="5.mp3" controls></audio>
    </span>
    <span>
        <audio src="6.mp3" controls></audio>
    </span>
    
    <footer>Copyright of All Video & Audio</footer>

</body>
</html>
