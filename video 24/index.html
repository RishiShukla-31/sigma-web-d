<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px 15px 5px #99dd5e;
        }
        .textshadow{
            text-shadow: 4px 2px 4px #95282888;
            outline: 2px solid black;
            border: 2px solid green;
            border-radius: 34px;
            outline-offset: 19px;
        }
    </style>
</head>
<body>
    <div class="box">
        this is a box
    </div>

    <p class="textshadow">
        Lorem ipsum dolor, sit amet consectetur adipisicing elit. Tenetur voluptatem provident omnis fugit minus reprehenderit ex, non autem sit quisquam dolor nostrum esse? Sit, ducimus eveniet. Officia pariatur incidunt dolore!
    </p>
</body>
</html>
