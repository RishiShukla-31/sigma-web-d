<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selector</title>
    <style>
        /* Element Selector */
        /* div{
            background-color: lightgreen;
        } */

        /* Class Selector */
        .brown{
            background-color: lightsteelblue;
        }

        /* ID Selector */
        #green{
            background-color: lightgreen;
        }

        /* Child Selector */
        /* div > p{
            color: rgb(48, 60, 72);
            background-color: rgb(89, 137, 89);
        } */

        /* Descendant Selector */
        div p{
            color: rgb(48, 132, 215);
            background-color: rgb(117, 189, 117);
        }

        /* Universal Selector */
        *{
            margin: 5px;
            padding: 5px;
        }

        /* Pseudo Code */
        a:visited{
            color:rgb(40, 21, 21)
        }

        a:link{
            color:lightgreen;
        }

        a:active{
            background-color: rgb(150, 222, 244);
        }

        a:hover{
            background-color: lightseagreen;
        }

        p:first-child{
            background-color: lightgray;
        }

    </style>

</head>
<body>
    <div class="one">
        <p>I am first</p>
        <p>I am Second</p>
    </div>
    <div class="brown">
        I'm a div
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Tempora, reiciendis!</p>
    </div>

    <div id="green">
        I'm also a div
    </div>
    <a target="_blank" href="https://www.google.com">Go to Google</a>
    <a target="_blank" href="https://www.Facebook.com">Go to Facebook</a>
    <a target="_blank" href="https://www.youtube.com">Go to YouTube</a>
</body>
</html>
